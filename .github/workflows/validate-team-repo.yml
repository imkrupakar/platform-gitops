# REUSABLE workflow: the PR check every team GitOps repo calls (see team-*-gitops/.github/workflows/validate.yml).
# It runs tools/check_team_layout.py from THIS repo against the caller's repo, so the rules live in one
# place and change for every team at once. Each leaf is rendered with its own pinned golden-service version.
name: validate-team-repo
on:
  workflow_call:
    inputs:
      chart-oci:
        description: OCI reference of the golden-service chart (without a version)
        type: string
        default: oci://ghcr.io/krupakar-hyland/charts/golden-service
    secrets:
      PLATFORM_READ_TOKEN:
        description: token that can read the platform repos when they are private (optional)
        required: false
permissions:
  contents: read
  packages: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the team repo (the caller)
        uses: actions/checkout@v4
        with:
          path: team
      - name: Check out the platform tooling and policy
        uses: actions/checkout@v4
        with:
          repository: krupakar-hyland/platform-gitops
          path: platform
          token: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: krupakar-hyland/platform-terraform
          path: tf
          token: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: krupakar-hyland/golden-helm-charts
          path: charts
          token: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}
      - uses: azure/setup-helm@v4
      - name: Log in to the chart registry (to pull each leaf's pinned chart version)
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Layout, goldenChart policy and render checks
        env:
          CHART_OCI: ${{ inputs.chart-oci }}
        run: |
          TEAM="${GITHUB_REPOSITORY#*/}"; TEAM="${TEAM%-gitops}"
          python3 platform/tools/check_team_layout.py \
            --team-repo team --team-name "$TEAM" \
            --fleet tf/fleet.yaml \
            --chart-dir charts/charts/golden-service --policy charts/support-policy.yaml \
            --chart-oci "$CHART_OCI"
