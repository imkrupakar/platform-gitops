apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Second safety net: Argo CD never deletes the tenant namespace (and with it every workload and
    # Secret in it) when the owning Application is deleted. Remove it manually when offboarding.
    argocd.argoproj.io/sync-options: Delete=false
  name: TEAM_NAME
  labels:
    tenant: TEAM_NAME
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
