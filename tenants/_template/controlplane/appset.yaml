# Copy and replace TEAM_NAME. Generates one Application per (service, cluster).
# Generators: cluster generator x team service LEAVES.
# The golden chart VERSION is team-owned: the team sets `goldenChart` in its own cluster
# LEAF file (apps/<svc>/envs/<env>/<cloud>/<region>/values.yaml), at the team's own pace.
# Add-on versions (ESO, cert-manager, ...) are unrelated to this appset — they're read from
# environments/<env>/<cloud>/<region>/versions.yaml by the separate platform-addons appset.
#
# A service is deployed to a cluster only when its CLUSTER LEAF exists in the team repo:
#   apps/<svc>/envs/<env>/<cloud>/<region>/values.yaml     (holds the image pin + goldenChart pin)
# so a new region renders nothing until a promotion PR opts each service in, and prd regions
# are promoted one at a time. NB: the leaf's content is also exposed as generator params, so do
# not use the top-level keys name/server/metadata/environment/cloud/region/addons in it.
# A leaf without `goldenChart` (or with an empty one) gets the deliberately invalid revision
# MISSING-goldenChart-in-leaf: only that Application errors, the rest of the AppSet is unaffected.
# The PR check (tools/check_team_layout.py) rejects such a leaf before it can merge.
#
# Values layers (later wins; every layer optional except base): base -> env -> env/cloud -> leaf.
# The chart also gets global.cloud/region/environment from the cluster's labels.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: TEAM_NAME-workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  workloads: "true"
          - git:
              repoURL: https://github.com/krupakar-hyland/TEAM_NAME-gitops
              revision: main
              files:
                - path: "apps/*/envs/{{.metadata.labels.environment}}/{{.metadata.labels.cloud}}/{{.metadata.labels.region}}/values.yaml"
  template:
    metadata:
      name: "TEAM_NAME-{{ index .path.segments 1 }}-{{.metadata.labels.environment}}-{{.metadata.labels.region}}"
      namespace: TEAM_NAME
      labels:
        tenant: TEAM_NAME
        service: "{{ index .path.segments 1 }}"
        environment: "{{.metadata.labels.environment}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: TEAM_NAME
      sources:
        - repoURL: ghcr.io/krupakar-hyland/charts # OCI Helm registry (no scheme); see argocd/repositories/repo-golden-charts.yaml
          chart: golden-service
          targetRevision: '{{ if and (hasKey . "goldenChart") .goldenChart }}{{ .goldenChart }}{{ else }}MISSING-goldenChart-in-leaf{{ end }}'
          helm:
            releaseName: "{{ index .path.segments 1 }}"
            # Cluster identity for cloud-aware chart logic (e.g. workload-identity labels).
            parameters:
              - name: global.cloud
                value: "{{.metadata.labels.cloud}}"
              - name: global.region
                value: "{{.metadata.labels.region}}"
              - name: global.environment
                value: "{{.metadata.labels.environment}}"
            valueFiles:
              - $values/apps/{{ index .path.segments 1 }}/base/values.yaml
              - $values/apps/{{ index .path.segments 1 }}/envs/{{.metadata.labels.environment}}/values.yaml
              - $values/apps/{{ index .path.segments 1 }}/envs/{{.metadata.labels.environment}}/{{.metadata.labels.cloud}}/values.yaml
              - $values/apps/{{ index .path.segments 1 }}/envs/{{.metadata.labels.environment}}/{{.metadata.labels.cloud}}/{{.metadata.labels.region}}/values.yaml
            ignoreMissingValueFiles: true
        - repoURL: https://github.com/krupakar-hyland/TEAM_NAME-gitops
          targetRevision: main
          ref: values
      destination:
        server: "{{.server}}"
        namespace: TEAM_NAME
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
