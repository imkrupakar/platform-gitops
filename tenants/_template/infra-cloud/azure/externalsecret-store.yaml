# Per-tenant ESO SecretStore for AZURE clusters (workload identity auth; no static credentials).
# Selected by the tenants-infra ApplicationSet from the cluster's `cloud` label:
#   tenants/<team>/infra-cloud/<cloud>/  ->  azure | aws   (add gke/ when a GKE cluster joins the fleet)
# The store NAME is identical on every cloud, so the golden chart's `storeRef` never changes.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: TEAM_NAME-store
  namespace: TEAM_NAME
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://kv-TEAM_NAME.vault.azure.net"
      serviceAccountRef:
        name: default
