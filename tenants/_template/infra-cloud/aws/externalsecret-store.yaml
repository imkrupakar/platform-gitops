# Per-tenant ESO SecretStore for AWS (EKS) clusters: AWS Secrets Manager via IRSA (no static credentials).
# Same store NAME as the azure variant, so the golden chart's `storeRef` is cloud-agnostic.
# Secrets Manager is regional: `region` below must match the cluster. Today there is one AWS
# cluster (us-east-1); when a second AWS region joins, key this folder by region as well.
# The referenced ServiceAccount needs the eks.amazonaws.com/role-arn annotation (IRSA) granting
# secretsmanager:GetSecretValue on this team's secrets.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: TEAM_NAME-store
  namespace: TEAM_NAME
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: default
