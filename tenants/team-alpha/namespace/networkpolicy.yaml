# Default-deny with same-tenant + ingress-controller + DNS allowances.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: team-alpha
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-tenant-and-dns
  namespace: team-alpha
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tenant: team-alpha
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              tenant: team-alpha
    - to: # DNS
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
