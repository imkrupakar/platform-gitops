# Per-tenant ESO SecretStore for AZURE clusters. Workload identity auth → no static credentials.
# Teams reference secrets via ExternalSecret in their own repo; ESO pulls from the vault.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: team-alpha-store
  namespace: team-alpha
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://kv-team-alpha.vault.azure.net"
      serviceAccountRef:
        name: default
