# Per-tenant SECRET STORE sourced from the TEAM's own gitops repo (team-owned content, platform-owned
# wiring). For each tenants/<team>/ folder and the local cluster, create an Application that syncs
#   <team>-gitops/infra/<cloud>/<env>/<region>/   (the ESO SecretStore: azurekv | aws SecretsManager)
# into the team namespace, under the TEAM's AppProject. <cloud> and <region> come from the cluster's
# `cloud`, `environment`, and `region` labels, so each cluster pulls its OWN env+region-local store
# (a prod vault is a different vault/subscription than sbx) while the store NAME stays constant so the
# chart's externalSecret.storeRef is cloud- and region-agnostic. The platform never authors the store
# (teams own their vault + identity); it only declares the repo/path convention.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants-secretstore
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  workloads: "true"
          - git:
              repoURL: https://github.com/krupakar-hyland/platform-gitops
              revision: main
              directories:
                - path: tenants/*
                - path: tenants/_template
                  exclude: true
  template:
    metadata:
      name: "tenant-{{.path.basename}}-secretstore"
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      # The TEAM's AppProject: the SecretStore is a namespaced resource the team is allowed to
      # create; teams still cannot create cluster-scoped ClusterSecretStore (clusterResourceWhitelist []).
      project: "{{.path.basename}}"
      source:
        repoURL: "https://github.com/krupakar-hyland/{{.path.basename}}-gitops"
        targetRevision: main
        path: "infra/{{.metadata.labels.cloud}}/{{.metadata.labels.environment}}/{{.metadata.labels.region}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - ServerSideApply=true
