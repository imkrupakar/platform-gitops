# Per-tenant INFRA on THIS cluster.
# For each tenants/<team>/ folder, deploy that tenant's cloud-agnostic isolation primitives
# (namespace, ResourceQuota, LimitRange, NetworkPolicy) to the local cluster. Platform-owned.
#
# NOTE: the per-tenant ESO SecretStore is NO LONGER created here. Teams own their own vault and
# author their SecretStore (and other namespaced config) in their gitops repo under
# config/envs/<env>/<cloud>/<region>/, applied by the team's own <team>-config ApplicationSet
# co-located in tenants/<team>/controlplane/config-appset.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants-infra
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  workloads: "true"
          - git:
              repoURL: https://github.com/krupakar-hyland/platform-gitops
              revision: main
              directories:
                - path: tenants/*
                - path: tenants/_template
                  exclude: true
  template:
    metadata:
      name: "tenant-{{.path.basename}}-infra"
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      # Platform-owned project: tenants cannot create ns/quota/netpol themselves.
      project: platform-tenants
      sources:
        - repoURL: https://github.com/krupakar-hyland/platform-gitops
          targetRevision: main
          path: "tenants/{{.path.basename}}/infra"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
