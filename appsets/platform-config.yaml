# Platform configuration that must exist on EVERY cluster but is not a Helm add-on. One Application per
# folder under config/ (today: the shared Istio Gateway in config/istio-gateway). Resources that
# depend on CRDs not yet synced on a brand-new cluster are tolerated via SkipDryRunOnMissingResource
# + retry. Namespaced manifests carry their own metadata.namespace; the destination below is only the
# fallback namespace.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-config
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/krupakar-hyland/platform-gitops
        revision: main
        directories:
          - path: config/*
  template:
    metadata:
      name: "config-{{.path.basename}}"
      annotations:
        argocd.argoproj.io/sync-wave: "-3"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-addons
      source:
        repoURL: https://github.com/krupakar-hyland/platform-gitops
        targetRevision: main
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: istio-ingress
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - CreateNamespace=true
