# Common values for the platform-config chart (applied on EVERY cluster). Layered first, then
# config/envs/<env>/values.yaml, config/envs/<env>/<cloud>/values.yaml, config/envs/<env>/<cloud>/<region>/values.yaml (later wins). The chart's own
# defaults already enable the gateway and the secretstore-guard (Deny); keep cross-env settings here.
istioGateway:
  enabled: true
  namespace: istio-ingress
secretstoreGuard:
  enabled: true
  serviceAccountName: eso-reader
