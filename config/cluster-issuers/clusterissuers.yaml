# cert-manager ClusterIssuers referenced by the golden chart's `ingress.clusterIssuer`.
#   letsencrypt-staging  untrusted certs, generous rate limits: the default for sbx/dev/stg
#   letsencrypt-prod     trusted certs: set by the team's envs/prd/values.yaml
# HTTP-01 is solved through the ingress controller. The ingress class below must match the
# cluster's ingress controller (ingress-nginx is archived upstream; update this when it is replaced).
# Replace REPLACE_ACME_EMAIL with a monitored mailbox (Let's Encrypt sends expiry notices there).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: REPLACE_ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE_ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
