# Shared platform ingress Gateway (Kubernetes Gateway API, implemented by Istio).
# The external L7 load balancer terminates TLS (certs configured on the LB) and forwards
# cleartext HTTP to this gateway, so the listener is HTTP :80 (no TLS/cert here).
# Istio's Gateway-API deployment controller auto-provisions the data-plane gateway
# (Deployment + Service) in this namespace. Team HTTPRoutes attach via parentRefs.
apiVersion: v1
kind: Namespace
metadata:
  name: istio-ingress
  labels:
    istio.io/dataplane-mode: none
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: istio-ingress
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
