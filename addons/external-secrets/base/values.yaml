# Common values for External Secrets Operator across all clusters.
installCRDs: true
replicaCount: 1
# The ESO controller deliberately has NO cloud identity (no workload-identity label/annotation).
# A SecretStore without serviceAccountRef falls back to the controller's own credentials, so any
# identity given to the controller would be usable by every tenant-authored SecretStore. Every
# store authenticates through an explicit serviceAccountRef instead: tenants use their own
# `eso-reader` SA (enforced by config/secretstore-guard), and the platform ClusterSecretStore
# (when added) uses a dedicated SA in the external-secrets namespace.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
