apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.default: role:readonly
  # GLOBAL policy is platform-only and tenant-agnostic. Per-tenant permissions live in
  # each tenant's AppProject `roles` (platform-gitops/tenants/<team>/controlplane/project.yaml),
  # so onboarding a team needs NO edit to this file — just the tenant folder.
  # Apps-in-any-namespace uses the 3-segment form <project>/<namespace>/<app>.
  policy.csv: |
    p, role:platform-admin, applications, *, */*, allow
    p, role:platform-admin, clusters, *, *, allow
    p, role:platform-admin, projects, *, *, allow
    p, role:platform-admin, repositories, *, *, allow
    g, krupakar-hyland:platform-engineering, role:platform-admin
  scopes: "[groups]"
