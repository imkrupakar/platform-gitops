# Declares the golden-service OCI Helm registry to Argo CD. OCI chart sources must be registered as a
# `helm` repository with enableOCI, otherwise `repoURL: ghcr.io/...` + `chart:` cannot be resolved.
# This Secret holds no credentials, so it is safe in Git (it works as-is for a public GHCR package).
# For a PRIVATE package, add username/password from the secret store with an ExternalSecret whose
# target is this Secret and `creationPolicy: Merge`; never commit them here.
apiVersion: v1
kind: Secret
metadata:
  name: repo-golden-charts
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: golden-charts
  type: helm
  url: ghcr.io/krupakar-hyland/charts
  enableOCI: "true"
