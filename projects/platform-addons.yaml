# Project for platform add-ons (ESO, cert-manager, ingress, rollouts). Add-ons may
# install CRDs and cluster-scoped resources, so this project is deliberately broad —
# but it is reserved for Platform Engineering and the add-ons ApplicationSet only.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-addons
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform add-ons managed by Platform Engineering
  sourceRepos:
    - https://github.com/krupakar-hyland/platform-gitops
    - https://charts.external-secrets.io
    - https://charts.jetstack.io
    - https://kubernetes.github.io/ingress-nginx
    - https://argoproj.github.io/argo-helm
  destinations:
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: argo-rollouts
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
